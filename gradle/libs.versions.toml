[versions]
agp = "9.4.0"

# libxposed API level this module targets. Must stay in sync with
# app/src/main/resources/META-INF/xposed/module.prop (minApiVersion / targetApiVersion).
libxposed = "102.0.0"

gson = "2.14.0"
jcal = "1.3.3"
appcompat = "1.8.0"
material = "1.14.0"

junit = "4.13.2"
androidxTestJunit = "1.3.0"
espresso = "3.7.0"

[libraries]
libxposed = { module = "io.github.libxposed:api", version.ref = "libxposed" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
jcal = { module = "ir.huri:JalaliCalendar", version.ref = "jcal" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }

name: Client watch

# Every week, checks the last five releases of every supported client - Nekogram, Cherrygram,
# Nagram and NagramX, full and base (GitHub releases), Forkgram, Forkgram Classic and Mercurygram (F-Droid,
# archive included) - and the latest official Telegram (telegram.org only serves the newest),
# and checks that every TeleVip feature's hook points still resolve in each (ClientApkTest).
# A build that breaks something fails the run (GitHub emails you) with the affected features in
# its summary, and opens an issue for that client if the repository has issues enabled; the issue
# is closed once all of the client's last five releases work again.
# Run it by hand with an APK URL (e.g. a direct APKPure download) to check any other build.
#
# When every client checks out on the weekly run, anything merged since the last release -
# Dependabot's Monday updates, fingerprint fixes - is released: the patch version and
# versionCode are bumped, the commits are listed in CHANGELOG.md, and Release publishes it.
on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Check only this APK (direct download URL; .apk or .xapk)'
        required: false

permissions:
  contents: read
  issues: write

jobs:
  clients:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          APK_URL: ${{ inputs.apk_url }}
        run: |
          if [ -n "$APK_URL" ]; then
            matrix=$(jq -nc --arg u "$APK_URL" '{include: [{client: "Manual check", source: "url", from: $u}]}')
          else
            # source/from/asset: see .github/scripts/client-builds.sh.
            matrix='{"include":[
              {"client":"Telegram","source":"url","from":"https://telegram.org/dl/android/apk","issue":true},
              {"client":"Nekogram","source":"github","from":"Nekogram/Nekogram","asset":"arm64-v8a","issue":true},
              {"client":"Cherrygram","source":"github","from":"arsLan4k1390/Cherrygram","asset":"arm64","issue":true},
              {"client":"Nagram","source":"github","from":"NextAlone/Nagram","asset":"arm64","issue":true},
              {"client":"NagramX","source":"github","from":"risin42/NagramX","asset":"^NagramX-.*arm64","only":true,"issue":true},
              {"client":"NagramX base","source":"github","from":"risin42/NagramX","asset":"^NagramX_base-.*arm64","only":true,"issue":true},
              {"client":"Forkgram","source":"fdroid","from":"org.forkgram.messenger","issue":true},
              {"client":"Forkgram Classic","source":"fdroid","from":"org.forkgram.classic","issue":true},
              {"client":"Mercurygram","source":"fdroid","from":"it.belloworld.mercurygram","issue":true}]}'
          fi
          echo "matrix=$(echo "$matrix" | jq -c .)" >> "$GITHUB_OUTPUT"

  check:
    name: ${{ matrix.client }}
    needs: clients
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.clients.outputs.matrix) }}

    env:
      GH_TOKEN: ${{ github.token }}
      CLIENT: ${{ matrix.client }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v6

      - name: List the builds to check
        env:
          SOURCE: ${{ matrix.source }}
          FROM: ${{ matrix.from }}
          ASSET: ${{ matrix.asset }}
          ONLY: ${{ matrix.only && 'only' || '' }}
        run: |
          if [ "$SOURCE" = github ]; then
            bash .github/scripts/client-builds.sh github "$FROM" "$ASSET" 5 $ONLY > builds.tsv
          else
            bash .github/scripts/client-builds.sh "$SOURCE" "$FROM" 5 > builds.tsv
          fi
          cat builds.tsv
          [ -s builds.tsv ] || { echo "::error::No $CLIENT build with an APK found."; exit 1; }

      - name: Check every build
        id: check
        run: |
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -n1)
          : > broken.txt
          : > summary.md
          while IFS=$'\t' read -r label url; do
            rm -f client.apk report.md
            # Big downloads from some servers drop mid-transfer: resume until complete.
            for attempt in 1 2 3 4 5; do
              curl -fsSL --retry 3 --retry-all-errors -C - -o client.apk "$url" && break
              [ "$attempt" = 5 ] && { echo "::error::Could not download $url."; echo "$label (download failed)" >> broken.txt; continue 2; }
              sleep 10
            done

            # An .xapk (APKPure) is a zip of split APKs: the code lives in the largest one.
            if unzip -l client.apk manifest.json >/dev/null 2>&1; then
              inner=$(unzip -Z1 client.apk '*.apk' | while read -r f; do
                echo "$(unzip -Zl client.apk "$f" | awk 'NR==1{print $4}') $f"; done | sort -rn | sed -n 1p | cut -d' ' -f2-)
              unzip -p client.apk "$inner" > base.apk && mv base.apk client.apk
            fi

            badging=$("$aapt2" dump badging client.apk 2>/dev/null | sed -n 1p)
            version="$(echo "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p") ($(echo "$badging" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p"))"
            echo "::group::$CLIENT $version"
            if TELEVIP_CLIENT_APK="$PWD/client.apk" TELEVIP_CLIENT_REPORT="$PWD/report.md" ./gradlew \
                :app:testDebugUnitTest --rerun --tests 'com.my.televip.obfuscate.resolve.ClientApkTest' --stacktrace \
                < /dev/null; then
              outcome=ok
            else
              outcome=broken
              echo "$version" >> broken.txt
            fi
            echo "::endgroup::"
            [ -f report.md ] || echo "The check produced no report; see the \"Check every build\" log." > report.md
            if [ "$outcome" = ok ]; then
              { echo "<details><summary>$CLIENT $version: every feature resolves</summary>"; echo; cat report.md; echo; echo "</details>"; echo; } >> summary.md
            else
              { echo "### $CLIENT $version: broken"; echo; cat report.md; echo; } >> summary.md
            fi
          done < builds.tsv
          [ -s broken.txt ] && echo "broken=true" >> "$GITHUB_OUTPUT" || true

      - name: Report
        env:
          BROKEN: ${{ steps.check.outputs.broken }}
          OPEN_ISSUES: ${{ matrix.issue }}
        run: |
          { echo "## $CLIENT"; echo; cat summary.md; } | tee -a "$GITHUB_STEP_SUMMARY" > body.md
          # Issues are off by default on forks; the failed run and this summary still report it.
          [ "$OPEN_ISSUES" = "true" ] || exit 0
          [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .has_issues)" = "true" ] || exit 0

          title="Client watch: $CLIENT"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
              --jq ".[] | select(.title == \"$title\") | .number" | head -n1)
          if [ "$BROKEN" != "true" ]; then
            [ -z "$number" ] || gh issue close "$number" --comment "Every hook point resolves again on all $(wc -l < builds.tsv) $CLIENT builds checked."
            exit 0
          fi
          # The same set of broken builds is reported once; a new one adds a comment.
          marker="Broken builds: $(paste -sd ',' broken.txt | sed 's/,/, /g')"
          { echo "$marker"; echo; cat body.md; } > issue.md
          if [ -z "$number" ]; then
            gh issue create --title "$title" --body-file issue.md
          elif ! gh issue view "$number" --json body,comments --jq '.body, .comments[].body' | grep -qF "$marker"; then
            gh issue comment "$number" --body-file issue.md
          fi

      - name: Fail when a feature broke
        if: steps.check.outputs.broken == 'true'
        run: exit 1

  release:
    name: Release pending changes
    needs: check
    # Weekly runs only, and only when every client passed: a broken client comes first.
    if: github.event_name == 'schedule' && needs.check.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Bump the version if anything changed since the last release
        id: bump
        run: |
          version=$(grep -m1 'versionName' app/build.gradle | cut -d'"' -f2)
          code=$(grep -m1 'versionCode' app/build.gradle | tr -dc '0-9')
          last="v$version"
          if ! git rev-parse -q --verify "refs/tags/$last" >/dev/null; then
            echo "::notice::$last has not been released yet; Release will publish it on its own."
            exit 0
          fi
          # Only what ends up in the APK counts; README, workflow or test-only changes do not.
          if git diff --quiet "$last" HEAD -- app/src/main app/build.gradle build.gradle settings.gradle \
              gradle.properties gradle; then
            echo "Nothing to release since $last."
            exit 0
          fi

          next="${version%.*}.$(( ${version##*.} + 1 ))"
          sed -i "s/versionCode = $code/versionCode = $((code + 1))/; s/versionName = \"$version\"/versionName = \"$next\"/" \
              app/build.gradle
          {
            echo "# Changelog"
            echo
            echo "## $next — weekly update"
            echo
            git log --no-merges --format='- %s' "$last"..HEAD -- app/src/main app/build.gradle build.gradle \
                settings.gradle gradle.properties gradle
            echo
            tail -n +3 CHANGELOG.md
          } > CHANGELOG.new && mv CHANGELOG.new CHANGELOG.md

          git config user.name "Faisal AlDossary"
          git config user.email 62283064+2B-4G10@users.noreply.github.com
          git commit -qam "Release $next"
          git push origin HEAD:main
          echo "released=$next" >> "$GITHUB_OUTPUT"

      # A push made with this workflow's token starts no workflows, so start Release directly.
      - name: Publish it
        if: steps.bump.outputs.released != ''
        run: gh workflow run release.yml --ref main


plugins {
    alias(libs.plugins.android.application)
}

// Property assignment uses 'name = value' throughout. The bare 'name value' Groovy space
// syntax is deprecated in Gradle 9 and removed in Gradle 10.
android {
    namespace = 'com.my.televip'
    compileSdk = 36

    defaultConfig {
        applicationId = "com.my.televip"
        minSdk = 27
        targetSdk = 36
        versionCode = 340
        versionName = "3.7.0"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary = true
        }
    }

    buildTypes {
        release {
            // Left off deliberately. R8 would rename the hook entry classes that the framework
            // looks up by name from META-INF/xposed/java_init.list, and the reflective client
            // resolvers in com.my.televip.Clients address the target app by string anyway.
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    // src/main/resources is packaged as java resources, which is where the modern Xposed
    // entry descriptors (META-INF/xposed/*) and the language packs (lang/*) live. They are
    // reached through the module class loader, so no APK path lookup is needed at runtime.
}

// Pin the compiler itself, not just the bytecode level. Without this the build compiles with
// whatever JDK happens to run Gradle - Android Studio uses its bundled JDK 25, CI uses Temurin 17 -
// and the two can disagree. The foojay resolver in settings.gradle downloads this toolchain when
// no matching JDK is installed, so a clean checkout builds without any local JDK setup.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    implementation libs.jcal

    // Modern libxposed API (102) - the only entry point, com.my.televip.xposed.TeleVipModule,
    // registered through META-INF/xposed/java_init.list. compileOnly: the framework that loads
    // us provides the implementation. The legacy de.robv (module API 93) path was removed.
    compileOnly libs.libxposed

    implementation libs.gson
    implementation libs.appcompat
    implementation libs.material

    // The test source sets existed with no test dependencies declared, so 'gradle build'
    // failed on 'package org.junit does not exist' while 'assembleRelease' passed.
    testImplementation libs.junit
    androidTestImplementation libs.androidx.test.junit
    androidTestImplementation libs.androidx.test.espresso.core
}
// ---------------------------------------------------------------------------
// DexHolder code generation
//
// :settingsadapter is built as a separate APK whose classes are loaded at runtime
// through InMemoryDexClassLoader (see com.my.televip.dex.DexInjector). Its dex is
// embedded here as a byte[] constant so nothing has to be read from disk inside the
// hooked process - under Zygisk Next the module class loader is sandboxed and the
// module APK path is not reliably reachable from the target process.
//
// Why this is not the original one-liner doLast block:
//
//  * Output goes to build/generated, never into src/. The old task wrote
//    DexHolder.java into src/main/java, which meant every build mutated a source
//    directory and the file had to be gitignored to keep the tree clean.
//  * Inputs and outputs are declared, so the task is incremental and cacheable
//    instead of re-serialising the whole dex on every single build.
//  * The dex is read straight out of the APK with ZipFile - no temp extract dir.
//  * The hex payload is emitted in chunks. A Java string *constant* is capped at
//    64 KB of UTF-8 in the class file, so one big literal would hard-fail the
//    build as soon as the adapter dex grew past ~32 KB.
//  * The APK is located under build/outputs/apk, which is AGP's stable published
//    location. The old path (build/intermediates/apk) has not existed since AGP 4
//    and made a clean build fail outright.
// ---------------------------------------------------------------------------

abstract class GenerateDexHolder extends DefaultTask {

    /** Directory AGP publishes the :settingsadapter APK into. */
    @InputFiles
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getApkDirectory()

    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()

    /** Characters per generated literal. Keeps every string constant well under the 64 KB cap. */
    private static final int CHUNK = 16000

    private static final String PACKAGE = "com.my.televip.dex"

    @TaskAction
    void generate() {
        def apks = apkDirectory.asFileTree.matching { include "**/*.apk" }.files.sort { it.name }
        if (apks.isEmpty()) {
            throw new GradleException("No APK produced by :settingsadapter. Searched: "
                    + apkDirectory.files.join(", ")
                    + "\nRun ':settingsadapter:assembleDebug' and check its output location.")
        }
        def apk = apks.first()

        byte[] dexBytes = null
        String dexName = null
        new java.util.zip.ZipFile(apk).withCloseable { zip ->
            for (def entry : Collections.list(zip.entries())) {
                if (!(entry.name ==~ /classes\d*\.dex/)) continue
                if (dexBytes != null && entry.size <= dexBytes.length) continue
                dexBytes = zip.getInputStream(entry).withCloseable { it.bytes }
                dexName = entry.name
            }
        }
        if (dexBytes == null) {
            throw new GradleException("No classes*.dex entry inside ${apk}")
        }

        def hex = new StringBuilder(dexBytes.length * 2)
        for (byte b : dexBytes) {
            hex.append(Character.forDigit((b >> 4) & 0xF, 16).toUpperCase())
            hex.append(Character.forDigit(b & 0xF, 16).toUpperCase())
        }

        def literals = new StringBuilder()
        for (int i = 0; i < hex.length(); i += CHUNK) {
            literals.append("\n            \"")
                    .append(hex, i, Math.min(i + CHUNK, hex.length()))
                    .append("\",")
        }

        def out = outputDirectory.get().asFile
        def pkgDir = new File(out, PACKAGE.replace('.' as char, File.separatorChar))
        pkgDir.mkdirs()

        new File(pkgDir, "DexHolder.java").text = """\
// Generated by the :app:generateDexHolder Gradle task. Do not edit.
// Source: ${dexName} from ${apk.name} (${dexBytes.length} bytes).
package ${PACKAGE};

public final class DexHolder {

    public static final byte[] DEX_BYTES = decode();

    private DexHolder() {
    }

    private static byte[] decode() {
        final String[] parts = {${literals}
        };
        int length = 0;
        for (String part : parts) {
            length += part.length();
        }
        final byte[] data = new byte[length / 2];
        int index = 0;
        for (String part : parts) {
            for (int i = 0; i < part.length(); i += 2) {
                data[index++] = (byte) ((Character.digit(part.charAt(i), 16) << 4)
                        + Character.digit(part.charAt(i + 1), 16));
            }
        }
        return data;
    }
}
"""

        logger.lifecycle("DexHolder: embedded ${dexName} (${dexBytes.length} bytes) from ${apk.name}")
    }
}

def generateDexHolder = tasks.register("generateDexHolder", GenerateDexHolder) {
    dependsOn(":settingsadapter:assembleDebug")
    apkDirectory.from(project(":settingsadapter").layout.buildDirectory.dir("outputs/apk/debug"))
}

// Generated sources have to go through the variant API, not android.sourceSets.
//
// android.sourceSets.main.java.srcDir(provider) does NOT work here: AGP reads the source
// set eagerly while configuring the variant, so the generated directory is only picked up
// if it already happens to exist on disk. That makes incremental builds look fine and any
// clean build fail with "cannot find symbol: DexHolder".
//
// addGeneratedSourceDirectory registers the task as the producer of a source directory, so
// AGP both wires the javac task dependency and owns the output location.
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.java.addGeneratedSourceDirectory(
                generateDexHolder, GenerateDexHolder::getOutputDirectory)
    }
}
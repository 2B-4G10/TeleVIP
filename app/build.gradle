plugins {
    alias(libs.plugins.android.application)
}

// Release signing reads keystore.properties, which is never committed: CI writes it from the
// KEYSTORE_* secrets, and locally it sits next to your .jks. Without it the release APK is
// unsigned (and cannot be installed); the debug APK always can be.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = 'com.my.televip'
    compileSdk = 37

    signingConfigs {
        release {
            if (keystoreProperties.containsKey("storeFile")) {
                storeFile = rootProject.file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                enableV2Signing = true
                enableV3Signing = true
            }
        }
    }

    defaultConfig {
        applicationId = "io.github.re_televip.televip"
        minSdk = 27
        targetSdk = 37
        versionCode = 351
        versionName = "1.1.2"

        vectorDrawables {
            useSupportLibrary = true
        }
    }

    buildTypes {
        release {
            // Off: the framework and the client resolvers look classes up by name.
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreProperties.containsKey("storeFile")) {
                signingConfig = signingConfigs.release
            } else {
                logger.warn("TeleVip: keystore.properties not found, the release APK will be unsigned.")
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

// Compile with JDK 17 whatever JDK runs Gradle (foojay downloads it if missing).
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    implementation libs.jcal

    // Provided at runtime by the framework.
    compileOnly libs.libxposed

    implementation libs.gson
    implementation libs.appcompat
    implementation libs.material

    testImplementation libs.junit
}
// :settingsadapter is a separate APK whose dex is embedded in the module as a byte[]
// (DexHolder) and loaded in memory by DexInjector, so nothing is read from disk inside the
// hooked process. The hex payload is split into chunks because a Java string constant is
// capped at 64 KB.
abstract class GenerateDexHolder extends DefaultTask {

    /** Directory AGP publishes the :settingsadapter APK into. */
    @InputFiles
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getApkDirectory()

    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()

    /** Characters per generated literal. Keeps every string constant well under the 64 KB cap. */
    private static final int CHUNK = 16000

    private static final String PACKAGE = "com.my.televip.dex"

    @TaskAction
    void generate() {
        def apks = apkDirectory.asFileTree.matching { include "**/*.apk" }.files.sort { it.name }
        if (apks.isEmpty()) {
            throw new GradleException("No APK produced by :settingsadapter. Searched: "
                    + apkDirectory.files.join(", ")
                    + "\nRun ':settingsadapter:assembleDebug' and check its output location.")
        }
        def apk = apks.first()

        byte[] dexBytes = null
        String dexName = null
        new java.util.zip.ZipFile(apk).withCloseable { zip ->
            for (def entry : Collections.list(zip.entries())) {
                if (!(entry.name ==~ /classes\d*\.dex/)) continue
                if (dexBytes != null && entry.size <= dexBytes.length) continue
                dexBytes = zip.getInputStream(entry).withCloseable { it.bytes }
                dexName = entry.name
            }
        }
        if (dexBytes == null) {
            throw new GradleException("No classes*.dex entry inside ${apk}")
        }

        def hex = new StringBuilder(dexBytes.length * 2)
        for (byte b : dexBytes) {
            hex.append(Character.forDigit((b >> 4) & 0xF, 16).toUpperCase())
            hex.append(Character.forDigit(b & 0xF, 16).toUpperCase())
        }

        def literals = new StringBuilder()
        for (int i = 0; i < hex.length(); i += CHUNK) {
            literals.append("\n            \"")
                    .append(hex, i, Math.min(i + CHUNK, hex.length()))
                    .append("\",")
        }

        def out = outputDirectory.get().asFile
        def pkgDir = new File(out, PACKAGE.replace('.' as char, File.separatorChar))
        pkgDir.mkdirs()

        new File(pkgDir, "DexHolder.java").text = """\
// Generated by the :app:generateDexHolder Gradle task. Do not edit.
// Source: ${dexName} from ${apk.name} (${dexBytes.length} bytes).
package ${PACKAGE};

public final class DexHolder {

    public static final byte[] DEX_BYTES = decode();

    private DexHolder() {
    }

    private static byte[] decode() {
        final String[] parts = {${literals}
        };
        int length = 0;
        for (String part : parts) {
            length += part.length();
        }
        final byte[] data = new byte[length / 2];
        int index = 0;
        for (String part : parts) {
            for (int i = 0; i < part.length(); i += 2) {
                data[index++] = (byte) ((Character.digit(part.charAt(i), 16) << 4)
                        + Character.digit(part.charAt(i + 1), 16));
            }
        }
        return data;
    }
}
"""

        logger.lifecycle("DexHolder: embedded ${dexName} (${dexBytes.length} bytes) from ${apk.name}")
    }
}

def generateDexHolder = tasks.register("generateDexHolder", GenerateDexHolder) {
    dependsOn(":settingsadapter:assembleDebug")
    apkDirectory.from(project(":settingsadapter").layout.buildDirectory.dir("outputs/apk/debug"))
}

// Registered through the variant API so a clean build knows the generated directory.
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.java.addGeneratedSourceDirectory(
                generateDexHolder, GenerateDexHolder::getOutputDirectory)
    }
}
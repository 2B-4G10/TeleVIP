plugins {
    alias(libs.plugins.android.application)
}

// Release signing reads keystore.properties, which is never committed: CI writes it from the
// KEYSTORE_* secrets, and locally it sits next to your .jks. Without it the release APK is
// unsigned (and cannot be installed); the debug APK always can be.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = 'com.my.televip'
    compileSdk = 37

    signingConfigs {
        release {
            if (keystoreProperties.containsKey("storeFile")) {
                storeFile = rootProject.file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                enableV2Signing = true
                enableV3Signing = true
            }
        }
    }

    defaultConfig {
        applicationId = "io.github.re_televip.televip"
        minSdk = 27
        targetSdk = 37
        versionCode = 354
        versionName = "1.1.5"

        vectorDrawables {
            useSupportLibrary = true
        }
    }

    buildTypes {
        release {
            // Off: the framework and the client resolvers look classes up by name.
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreProperties.containsKey("storeFile")) {
                signingConfig = signingConfigs.release
            } else {
                logger.warn("TeleVip: keystore.properties not found, the release APK will be unsigned.")
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

// Compile with JDK 17 whatever JDK runs Gradle (foojay downloads it if missing).
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    implementation libs.jcal

    // Provided at runtime by the framework.
    compileOnly libs.libxposed

    implementation libs.gson
    implementation libs.appcompat
    implementation libs.material

    testImplementation libs.junit
}

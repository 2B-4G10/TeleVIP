// Built as an application rather than a library on purpose: only an APK gives us a dex file,
// and :app embeds that dex as a byte[] (see the generateDexHolder task in app/build.gradle).
plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace = 'com.televip.SettingsAdapter'
    compileSdk = 36

    defaultConfig {
        applicationId = "com.televip.SettingsAdapter"
        minSdk = 27
        targetSdk = 36
        versionCode = 1
        versionName = "1.0"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

// Must match :app - this module's dex is embedded into :app, so both are compiled by the
// same JDK regardless of what runs Gradle. See the note in app/build.gradle.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    // compileOnly on purpose: these classes are provided by the *target* Telegram client at
    // runtime, not by this APK. Only the dex is extracted and injected, never the dependencies.
    compileOnly libs.appcompat
    compileOnly libs.material
}